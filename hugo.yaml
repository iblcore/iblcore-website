baseURL: "https://iblcore.org/"
locale: "en-US"
title: "IBL-Core"
enableRobotsTXT: true

params:
  description: "IBL-Core public website built with Hugo, vanilla HTML, CSS, and minimal JavaScript."
  tagline: "Open neuroscience infrastructure, software, and collaboration."
  fingerprintAssets: false
  umami:
    enabled: true
    customEvents: true
    scriptURL: "/t.js"
    hostURL: "https://iblcore.org"
    websiteID: "b174e1b4-4d3b-41e2-b49c-f8d30d49c8f9"
    domains:
      - "iblcore.org"
  funders:
    - "IBL"
    - "Open science partners"
    - "Research funders"

# Declaring any taxonomy replaces Hugo's defaults, so Hugo's own tag and
# category are dropped here. No content used either.
taxonomies:
  modality: modality
  stage: stage
  access: access

# The taxonomy plural doubles as the front matter key, so the vocabularies are
# authored as `modality:`, `stage:` and `access:`. Permalinks move the generated
# pages under /resources/, where the content defining them lives.
permalinks:
  taxonomy:
    modality: /resources/modalities/
    stage: /resources/stages/
    access: /resources/access-routes/
  term:
    modality: /resources/modalities/:slug/
    stage: /resources/stages/:slug/
    access: /resources/access-routes/:slug/

markup:
  goldmark:
    renderer:
      unsafe: false
