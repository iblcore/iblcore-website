{{ define "main" }}
  <div class="about-single-page">
    <section class="about-single-hero section-hero" aria-labelledby="about-single-title">
      <div class="about-single-hero__media section-hero__media" aria-hidden="true"></div>
      <div class="shell page-shell about-single-hero__inner section-hero__inner">
        <div class="about-single-hero__copy section-hero__copy">
          <h1 id="about-single-title">{{ .Title }}</h1>
        </div>
      </div>
    </section>

    <section class="about-single-content">
      <div class="shell page-shell">
        <article class="about-single-prose prose">
          {{ $blockIndex := 0 }}
          {{ range $sectionIndex, $section := split .Content "<h2" }}
            {{ if gt (len (strings.TrimSpace $section)) 0 }}
              {{ $blockIndex = add $blockIndex 1 }}
              <section class="about-content-block about-content-block--{{ mod $blockIndex 3 }}">
                {{ if eq $sectionIndex 0 }}
                  {{ $section | safeHTML }}
                {{ else }}
                  {{ printf "<h2%s" $section | safeHTML }}
                {{ end }}
              </section>
            {{ end }}
          {{ end }}
        </article>
      </div>
    </section>
  </div>
{{ end }}
