<figure class="new-partners-team-person">
  <img
    class="new-partners-person__image new-partners-team-person__image"
    src="{{ .image | relURL }}"
    alt="{{ .alt }}"
    style="object-position: {{ .object_position | default "center" }};"
    loading="lazy"
  >
  {{ with .caption }}<figcaption class="new-partners-team-person__name">{{ . }}</figcaption>{{ end }}
</figure>
