{{ define "main" }}
  {{ partial "page-header.html" (dict "page" .) }}

  <section class="section section-band dataset-section">
    <div class="shell page-shell">
      <ul class="resource-term-list">
        {{ range .Pages }}
          <li>
            <a class="text-link" href="{{ .RelPermalink }}">{{ partial "resources/term-title.html" . }}</a>
            <span class="resource-term-list__count">{{ len .Pages }}</span>
          </li>
        {{ end }}
      </ul>
    </div>
  </section>
{{ end }}
