name: CI

on:
  push:
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.1'
          extended: true

      - name: Build site
        run: hugo --panicOnWarning --cleanDestinationDir

      - name: Validate resource dependencies
        run: node scripts/validate-requires.mjs

      - name: Validate resource graph output
        run: |
          if rg -q '<span class=("[^"]*"|[^>]*)is-missing' public/resources; then
            rg '<span class=("[^"]*"|[^>]*)is-missing' public/resources
            exit 1
          fi
